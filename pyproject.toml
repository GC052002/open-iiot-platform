[project]
name = "iiot-platform-backend"
version = "0.1.0"
description = "Backend asíncrono (FastAPI + asyncio) para la plataforma IIoT Open Source"
readme = "README.md"
# R7 (§0.6, precedente pymodbus): techo en <3.14. Python 3.14 cambia el manejo de
# anotaciones (PEP 649) y Pydantic 2.13.x (la última) rompe al evaluar type hints
# (`AssertionError` en `eval_type_backport`) → el backend ni siquiera importa.
# Verificado OK en 3.11/3.12/3.13. Se subirá el techo cuando Pydantic publique
# soporte de 3.14. Mejor fallar en el install con un mensaje claro que con un 500.
requires-python = ">=3.11,<3.14"
license = { file = "LICENSE" }

dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.29,<1",
    "pydantic>=2.6,<3",
    # R6 (ARCHITECTURE §3.10): pin de pymodbus. Techo en <3.9: 3.9+ inicia la
    # migración del datastore a SimData/SimDevice (rumbo a 4.0) y depreca la API
    # clásica de servidor que usa el simulador. Se revisará al portar a 4.x.
    "pymodbus>=3.6,<3.9",
    "cryptography>=42",          # Fernet (cifrado de credenciales, §3.5)
]

[project.optional-dependencies]
# Drivers adicionales — se activan en Fase 2 (ver ROADMAP.md).
drivers = [
    # 2.x incluye los binarios nativos de snap7 (sin instalar libsnap7 en el SO).
    "python-snap7>=2.0,<3",     # Siemens S7 (F2.3)
    "asyncua>=1.1",             # OPC UA (F2.3)
    "aiomqtt>=2.0",             # MQTT async nativo (F2.2, §11.2)
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "httpx>=0.27",              # TestClient / WS testing
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
pythonpath = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py311"
